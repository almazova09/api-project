name: CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "api/**"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-test-analyze:
    name: Build, Test, Analyze and Push
    runs-on: ubuntu-latest

    steps:
      # 1 Checkout code
      - name: Checkout SCM
        uses: actions/checkout@v4

      # 2 Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: api/package.json

      # 3 Install dependencies
      - name: Install dependencies
        working-directory: api
        run: npm install

      # 4 Run unit tests
      - name: Run unit tests
        working-directory: api
        run: npm test --if-present

      # 5 Dependency vulnerability scan
      - name: Dependency vulnerability scan
        working-directory: api
        run: |
          npm audit --audit-level=moderate || true

      # 6 Build Docker image
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: false
          tags: api-app:latest

      # 7 Trivy container scan
      - name: Container image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: api-app:latest
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 8 Login to ACR
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 9 Push image to ACR
      - name: Push image to ACR
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/api-app:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/api-app:${{ github.sha }}

      # 10 Upload summary
      - name: Upload summary
        if: success()
        run: echo "CI completed successfully!" >> $GITHUB_STEP_SUMMARY
